name: Deploy to Vercel

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Reset Vercel local state
        run: rm -rf .vercel

      - name: Link project
        run: |
          SCOPE_ARGS=""
          if [ -n "${VERCEL_SCOPE}" ]; then
            SCOPE_ARGS="--scope=${VERCEL_SCOPE}"
          fi
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} --project=my-day ${SCOPE_ARGS}

      - name: Deploy to Vercel
        run: |
          SCOPE_ARGS=""
          if [ -n "${VERCEL_SCOPE}" ]; then
            SCOPE_ARGS="--scope=${VERCEL_SCOPE}"
          fi
          vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} ${SCOPE_ARGS}
